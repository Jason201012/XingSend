name: Release XingSend

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_windows:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build Windows
        working-directory: app
        run: flutter build windows

      - name: Prepare payload
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\payload" | Out-Null
          Copy-Item -Path "app\build\windows\x64\runner\Release\*" -Destination "${{ runner.temp }}\payload" -Recurse
          Copy-Item -Path "app\assets\packaging\logo.ico" -Destination "${{ runner.temp }}\payload"
          Copy-Item -Path "support\build\windows\x64\*" -Destination "${{ runner.temp }}\payload" -Recurse

      - name: Zip portable
        run: Compress-Archive -Path "${{ runner.temp }}\payload\*" -DestinationPath "${{ runner.temp }}\XingSend-portable.zip"

      - name: Build installer (unsigned)
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\inno-result" | Out-Null
          iscc /DSkipSignTool /DSkipMsixHelper "/DPayloadDir=${{ runner.temp }}\payload" "/DResultDir=${{ runner.temp }}\inno-result" support\scripts\compile_windows_exe-inno.iss

      - name: Rename artifacts
        run: |
          Rename-Item "${{ runner.temp }}\inno-result\XingSend.exe" "XingSend-setup.exe"
          Rename-Item "${{ runner.temp }}\XingSend-portable.zip" "XingSend-portable.zip"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-setup
          path: ${{ runner.temp }}\inno-result\XingSend-*.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: ${{ runner.temp }}\XingSend-*.zip
          if-no-files-found: error

  build_android:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Decode key.properties
        env:
          ENCODED: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: echo "$ENCODED" | base64 -di > app/android/key.properties

      - name: Decode keystore
        env:
          ENCODED: ${{ secrets.ANDROID_KEY_STORE }}
        run: echo "$ENCODED" | base64 -di > app/android/xingsend.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Apply rust-toolchain.toml pin
        working-directory: packages/localsend_isolates
        run: rustup show

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Rename APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk XingSend.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: XingSend.apk
          if-no-files-found: error

  release:
    needs: [version, build_windows, build_android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-setup
          path: rel

      - uses: actions/download-artifact@v7
        with:
          name: windows-portable
          path: rel

      - uses: actions/download-artifact@v7
        with:
          name: android-apk
          path: rel

      - name: Write release notes
        run: |
          cat > notes.md << 'NOTES_EOF'
          XingSend ${{ needs.version.outputs.version }} —— 基于 LocalSend v${{ needs.version.outputs.version }} 的个人改名版。

          ## 下载

          | 文件 | 用途 |
          |---|---|
          | `XingSend-${{ needs.version.outputs.version }}-setup.exe` | Windows 安装程序（推荐） |
          | `XingSend-${{ needs.version.outputs.version }}-portable.zip` | Windows 便携版，解压即用 |
          | `XingSend-${{ needs.version.outputs.version }}.apk` | 安卓安装包（通用，含全部 ABI） |

          ## 说明

          - 安卓包名 `com.xingsend.app`，Windows 独立 AppId，可与官方 LocalSend 并存
          - 传输协议与官方 LocalSend 完全兼容，可互相发现、互传文件
          - 改动清单见仓库 [REBRAND.md](https://github.com/Jason201012/XingSend/blob/main/REBRAND.md)

          基于 [LocalSend](https://github.com/localsend/localsend)（Apache-2.0），感谢原作者与社区。
          NOTES_EOF

      - name: Create/attach release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: XingSend ${{ needs.version.outputs.version }}
          body_path: notes.md
          files: rel/*
          fail_on_unmatched_files: true
